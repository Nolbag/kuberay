# Temporary fork-only test for the downstream notification path.
name: Test Ray module notification from fork

on:
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: github.repository == 'Nolbag/kuberay' && github.ref == 'refs/heads/RHOAIENG-102298'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger receiver fork
        env:
          GH_TOKEN: ${{ secrets.RAY_MODULE_DISPATCH_TOKEN }}
          BASE_BRANCH: main
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          dispatch_payload="$(jq -cn \
            --arg base_branch "$BASE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "$SOURCE_REPOSITORY" \
            '{event_type: "kuberay-downstream-update", client_payload: {base_branch: $base_branch, source_sha: $source_sha, repository: $repository}}')"

          gh api --method POST repos/Nolbag/ray-module-operator/dispatches \
            --input - <<<"$dispatch_payload"
